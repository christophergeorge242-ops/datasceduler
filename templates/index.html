<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>makemyday</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=DM+Sans:wght@400;500;600;700&family=Playfair+Display:ital,wght@0,600;0,700;1,600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}" />
  <link rel="stylesheet" href="{{ url_for('static', filename='deadline-editor.css') }}" />
  <link rel="stylesheet" href="{{ url_for('static', filename='unavailable.css') }}" />
</head>
<body>
  <aside class="sidebar">
    <a class="logo" href="#"><span class="sun">✦</span> makemyday</a>
    <nav>
      <a class="nav-active" href="#planner"><span>▦</span> Today</a>
      <a href="#tasks"><span>□</span> Tasks <b id="task-count">0</b></a>
      <a href="#"><span>◷</span> History</a>
    </nav>
  </aside>
  <main>
    <header><div><p class="eyebrow" id="date-label">MONDAY, SEPTEMBER 8</p></h1></div><div class="header-actions"><button class="outline-btn" id="clear-btn">Clear tasks</button></div></header>

    <section class="intro"><div class="progress-wrap"><div><span id="progress-text">0 of 0 planned</span><span id="progress-pct">0%</span></div><div class="progress"><i id="progress-bar"></i></div></div></section>

    <section class="workspace">
      <div class="task-panel" id="tasks"><div class="section-title"><h3>Tasks</h3><span>01</span></div>
        <form id="task-form">
          <label>WHAT DO YOU NEED TO DO?<input id="task-name" required maxlength="70" placeholder="e.g. Finish project proposal" /></label>
          <div class="form-grid"><label>DEADLINE<input id="deadline" type="date" required /></label><label>DUE TIME<input id="due-time" type="time" value="23:59" required /></label></div>
          <div class="form-grid"><label>EST. TIME<select id="duration"><option value="30">30 min</option><option value="45">45 min</option><option value="60" selected>1 hour</option><option value="90">1.5 hours</option><option value="120">2 hours</option></select></label></div>
          <div class="form-grid"><label>PRIORITY<select id="priority"><option>High</option><option selected>Medium</option><option>Low</option></select></label><label>BEST TIME<select id="preferredTime"><option>Morning</option><option>Afternoon</option><option>Evening</option><option selected>Anytime</option></select></label></div>
          <button class="add-btn" type="submit"><span>＋</span> Add to my day</button>
        </form>
        <div class="task-list" id="task-list"></div>
        <div class="unavailable"><div class="unavailable-head"><h4>Unavailable time</h4><span>FIXED BLOCKS</span></div>
          <form id="busy-form" class="busy-form"><input id="busy-title" maxlength="30" placeholder="e.g. Biology lecture" required><input id="busy-start" type="time" value="10:00" required><input id="busy-end" type="time" value="11:00" required><button type="submit" aria-label="Add unavailable time">＋</button></form>
          <div id="busy-list"></div>
        </div>
      </div>
      <div class="schedule-panel" id="planner"><div class="section-title"><h3>Today’s flow</h3><button id="generate-btn">↻ Optimize schedule</button></div><div class="empty-state" id="empty-state"><span>☼</span><h3>nothing planned</h3></div><div class="timeline" id="timeline"></div></div>
    </section>
  </main>
  <template id="task-template"><article class="task-item"><span class="priority-dot"></span><div class="task-copy"><strong></strong><small></small></div><div class="task-actions"><button class="edit-deadline" type="button">Edit deadline</button><button class="remove-task" type="button" aria-label="Remove task">×</button></div></article></template>
  <script src="{{ url_for('static', filename='app.js') }}"></script>
</body>
</html>
